name: Mise à jour calendrier LMU

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: calendrier-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install requests beautifulsoup4 lxml

      - name: Récupérer les données
        run: python lmu_calendar.py

      - name: Vérifier les fichiers
        run: |
          test -f docs/index.html
          test -s docs/lmu_events.json
          python -m json.tool docs/lmu_events.json > /dev/null

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers à publier
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
